# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.9 or backports.zoneinfo package.
# Any required deps can installed be added to the pyproject.toml & .venv
# using pip install -e .[dev]
# timezone =

# max length of characters to slugify the 'message' into
# slug_len = 40

# version path separator; As mentioned above, this is the character used to split
# version_locations. The default within new migrations is hierarchically.
# version_path_separator = os.sep

# version locations are directories to search for migration scripts.
# version_locations = migrations

# the output encoding used when revision files are written
# script_encoding = utf-8

sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hook]
# post_write_hook defines a function or functions to be run after a migration
# script is written. This can be used to format the migration script.
# See https://alembic.sqlalchemy.org/en/latest/cookbook.html
# post_write_hook =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S